[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-orbit-design"
version = "0.1.0"
description = "DRO–RO two-impulse transfer orbit design scripts (paper reproduction)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    "matplotlib>=3.10.0",
    "fonttools>=4.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pyright]
extraPaths = ["../e2m2e"]
pythonVersion = "3.13"

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*"]
