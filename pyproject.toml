[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-orbit-design"
version = "0.1.0"
description = "DRO–RO two-impulse transfer orbit design scripts (paper reproduction)"
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.66",
    "PyQt6>=6.6.0",
    "e2m2e",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Repository = "https://github.com/ouyangjiahong/transfer-orbit-design"

[tool.uv.sources]
e2m2e = { path = "../e2m2e", editable = true }

[tool.pyright]
extraPaths = ["../e2m2e"]
pythonVersion = "3.13"

[tool.pytest.ini_options]
markers = [
    "spice: tests requiring SPICE kernels (de440.bsp, naif0012.tls)",
    "slow: tests that take more than a few seconds to run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tod*"]
exclude = ["tests*", "scripts*"]
