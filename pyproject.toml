[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-orbit-design"
version = "1.1.0"
description = "地月空间 CR3BP 轨道生成、转移设计与星历转换脚本工具集"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.66",
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "e2m2e",
]

[tool.uv.sources]
e2m2e = { path = "../e2m2e", editable = true }

[project.optional-dependencies]
test = ["pytest>=7.0"]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-intl>=2.0",
]

[project.scripts]
transfer-orbit-design = "tod.gui.main:main"

[project.urls]
Repository = "https://github.com/cislunarspace/transfer-orbit-design"

[tool.pyright]
pythonVersion = "3.13"
reportMissingImports = "none"
include = ["tod", "scripts"]
exclude = ["tests"]

[tool.pytest.ini_options]
markers = [
    "spice: tests requiring SPICE kernels (de440.bsp, naif0012.tls)",
    "slow: tests that take more than a few seconds to run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tod*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
"tod.gui.i18n" = ["*.qm", "*.json"]
