[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-orbit-design"
version = "4.1.1"
description = "地月空间转移轨道设计与分析脚本工具集，提供 CR3BP 轨道生成、转移设计、绘图和星历转换能力"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.66",
    "e2m2e>=5.8.5",  # 5.8.5 族成员响应下发 period/mu、catalog_get 帧映射（#525/#526）；5.8.4 serve-stdio 修复（#522），两者为 Tauri sidecar 链路必需；5.8.2 轨道族生成支持 DRO（#502）；5.8.1 DPO 星历修正自动重定向 segmented（#484）；5.8.0 轨道库 catalog（#475，ADR 0031）；5.7.3 NRHO 星历修正默认路径收敛（#473）
    "pillow>=10.0.0",  # GIF 合成；matplotlib 的既有传递依赖，显式声明本仓库使用
    "calcephpy==5.0.0",  # 经 e2m2e→r2s2 传递依赖；显式声明以使 [tool.uv.sources] 生效（uv sources 仅覆盖直接依赖）
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-intl>=2.0",
]

[project.urls]
Repository = "https://github.com/cislunarspace/transfer-orbit-design"

[tool.pyright]
pythonVersion = "3.13"
reportMissingImports = "none"
include = ["src"]
exclude = ["tests", "src/commons/viz"]  # viz 为收编的第三方代码（原 e2m2e tools/viz），不承担本仓类型标准
# 显式指定 venv：pyright 的 venv 自动探测在部分环境失效（会退回系统 python，
# 导致解析不到 venv 内的 e2m2e/matplotlib 而误报 0 错误），钉死 .venv 与 CI 对齐。
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
markers = [
    "spice: tests requiring SPICE kernels (de440.bsp, naif0012.tls)",
    "slow: tests that take more than a few seconds to run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "scripts*"]

[dependency-groups]
dev = ["ruff>=0.1", "pyright>=1.1"]
build = ["pyinstaller>=6.0"]

# calcephpy（e2m2e→r2s2 的传递依赖）PyPI 仅有 sdist，Windows 需 cmake+MSVC
# 现场编译。用 [tool.uv.sources] 在 Windows 上指向 e2m2e 仓库 calcephpy-v1
# release 的预编译 wheel（cp313，win_amd64）；其他平台不匹配 marker，回落
# 到镜像 sdist 现场编译（CI runner 自带工具链）。本仓库 requires-python>=3.13，
# 故只需 cp313。重新生成 uv.lock 需 uv lock --upgrade-package calcephpy。
[tool.uv]
# 锁文件会记录制品下载 URL；使用 PyPI 官方源保证 GitHub Actions 与开发环境
# 都能按 --frozen 重现安装。需要镜像时由本地 UV_INDEX_URL 显式覆盖。
index-url = "https://pypi.org/simple"

[tool.uv.sources]
calcephpy = [
  { url = "https://github.com/cislunarspace/e2m2e/releases/download/calcephpy-v1/calcephpy-5.0.0-cp313-cp313-win_amd64.whl", marker = "sys_platform == 'win32'" },
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["tests/", "docs/", "scripts/", "tools/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]