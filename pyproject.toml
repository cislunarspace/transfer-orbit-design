[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "transfer-orbit-design"
version = "3.1.2"
description = "地月空间转移轨道设计与分析脚本工具集，提供 CR3BP 轨道生成、转移设计、绘图和星历转换能力"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.4.0",
    "scipy>=1.17.0",
    "matplotlib>=3.10.0",
    "tqdm>=4.66",
    "PyQt6>=6.6.0",
    "PyQt6-WebEngine>=6.6.0",
    "e2m2e==5.6.3",
    "pillow>=10.0.0",  # GIF 合成；matplotlib 的既有传递依赖，显式声明本仓库使用
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-qt>=4.5.0",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
    "sphinx-intl>=2.0",
]

[project.scripts]
transfer-orbit-design = "src.app.main:main"

[project.urls]
Repository = "https://github.com/cislunarspace/transfer-orbit-design"

[tool.pyright]
pythonVersion = "3.13"
reportMissingImports = "none"
include = ["src"]
exclude = ["tests"]

[tool.pytest.ini_options]
markers = [
    "spice: tests requiring SPICE kernels (de440.bsp, naif0012.tls)",
    "slow: tests that take more than a few seconds to run",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "plot*"]
exclude = ["tests*", "scripts*"]

[tool.setuptools.package-data]
"src.app.i18n" = ["*.qm", "*.json"]

[dependency-groups]
dev = ["ruff>=0.1", "pyright>=1.1"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = ["tests/", "docs/", "scripts/", "tools/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
