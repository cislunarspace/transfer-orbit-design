name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --frozen --no-install-project
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: uv sync --extra test --frozen
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --no-sync pytest tests/ -v -m "not spice"

  build-windows:
    needs: test
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: uv sync --group build --frozen
      - name: Build sidecar (PyInstaller onefile)
        run: uv run --no-sync pyinstaller packaging/tod_sidecar.spec --noconfirm
      - name: Stage sidecar into tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item dist/tod-sidecar.exe src-tauri/binaries/tod-sidecar.exe
      - name: Build NSIS installer
        run: npm --prefix frontend exec -- tauri build --config packaging/tauri.release.conf.json
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # 直传 Release，不经 actions artifact 中转（artifact 存储配额有限，
      # 历史上 300MB 级安装包很快打满；Release 资产不计入该配额）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}
          files: src-tauri/target/release/bundle/nsis/*-setup.exe
          generate_release_notes: true
