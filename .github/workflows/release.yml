name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --group dev --frozen --no-install-project
      - run: uv run --frozen --no-sync ruff check .
      - run: uv run --frozen --no-sync ruff format --check .

  test:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # 星历内核（kernels/*.bsp）经 Git LFS 入库，需拉取真实二进制
          lfs: true
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libegl1
      - run: uv sync --extra test --frozen
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run --frozen --no-sync pytest tests/ -v -m "not spice"

  build-windows:
    needs: test
    runs-on: windows-2025
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # 星历内核（kernels/*.bsp）经 Git LFS 入库，需拉取真实二进制
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: uv sync --group build --frozen
      - name: Build sidecar (PyInstaller onefile)
        run: uv run --no-sync pyinstaller packaging/transfer_orbit_design_sidecar.spec --noconfirm
      # 打包冒烟闸：design_orbit 真调用走完整星历链（R2S2 包内 lte440 打开、
      # SPICE 内核加载、修正收敛），漏带依赖/数据的坏包在此变红，不进安装包
      - name: Smoke sidecar (design_orbit real call)
        run: uv run --no-sync python scripts/smoke_mcp_serve.py --exe dist/transfer-orbit-design-sidecar.exe --cwd . --kernels kernels
      - name: Stage sidecar into tauri resources
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Copy-Item dist/transfer-orbit-design-sidecar.exe src-tauri/binaries/transfer-orbit-design-sidecar.exe
      - name: Build NSIS installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix frontend exec -- tauri build --config packaging/tauri.release.conf.json --bundles nsis
      - name: Generate changelog
        id: changelog
        shell: bash
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "$PREV_TAG"..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" HEAD)
          fi
          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      # 直传 Release，不经 actions artifact 中转（artifact 存储配额有限，
      # 历史上 300MB 级安装包很快打满；Release 资产不计入该配额）
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: |
            ## Changes

            ${{ steps.changelog.outputs.changelog }}
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
          generate_release_notes: true

  build-linux:
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          # 星历内核（kernels/*.bsp）经 Git LFS 入库，需拉取真实二进制
          lfs: true
      - name: Install system dependencies for Tauri and WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libegl1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run build
      - run: uv sync --group build --frozen
      - name: Build sidecar (PyInstaller onefile)
        run: uv run --no-sync pyinstaller packaging/transfer_orbit_design_sidecar.spec --noconfirm
      # 打包冒烟闸：同 Windows 作业，design_orbit 真调用守卫坏包
      - name: Smoke sidecar (design_orbit real call)
        run: uv run --no-sync python scripts/smoke_mcp_serve.py --exe dist/transfer-orbit-design-sidecar --cwd . --kernels kernels
      - name: Stage sidecar into tauri resources
        run: |
          mkdir -p src-tauri/binaries
          cp dist/transfer-orbit-design-sidecar src-tauri/binaries/transfer-orbit-design-sidecar
          chmod +x src-tauri/binaries/transfer-orbit-design-sidecar
      - name: Build AppImage and DEB bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm --prefix frontend exec -- tauri build --config packaging/tauri.release.conf.json --bundles appimage,deb
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/deb/*.deb.sig

  publish-updater:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets and generate latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          mkdir -p release-assets
          gh release download "$TAG_NAME" --dir release-assets --repo "${{ github.repository }}"

          VERSION="${TAG_NAME#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          WIN_SIG=$(cat release-assets/*.exe.sig 2>/dev/null || echo "")
          APPIMAGE_SIG=$(cat release-assets/*.AppImage.sig 2>/dev/null || echo "")

          # 获取 release 资产的下载链接
          WIN_URL=$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json assets -q '.assets[] | select(.name | endswith("-setup.exe")) | .url')
          APPIMAGE_URL=$(gh release view "$TAG_NAME" --repo "${{ github.repository }}" --json assets -q '.assets[] | select(.name | endswith(".AppImage")) | .url')

          cat <<EOF > latest.json
          {
            "version": "$VERSION",
            "notes": "Release $TAG_NAME",
            "pub_date": "$PUB_DATE",
            "platforms": {
              "windows-x86_64": {
                "signature": "$WIN_SIG",
                "url": "$WIN_URL"
              },
              "linux-x86_64": {
                "signature": "$APPIMAGE_SIG",
                "url": "$APPIMAGE_URL"
              }
            }
          }
          EOF

          gh release upload "$TAG_NAME" latest.json --clobber --repo "${{ github.repository }}"

