name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "output/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "output/**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install e2m2e@git+https://github.com/cislunarspace/e2m2e.git@v4.1.0
          pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -v

      - name: Type check
        if: matrix.python-version == '3.13'
        run: |
          pip install pyright
          pyright
