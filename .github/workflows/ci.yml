name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "output/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "output/**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install e2m2e@git+https://github.com/cislunarspace/e2m2e.git
          pip install -e ".[test]"

      - name: Run tests
        run: pytest tests/ -v -m "not spice"

      - name: Type check
        run: |
          pip install pyright
          pyright
