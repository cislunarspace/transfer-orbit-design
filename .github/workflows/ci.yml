name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "output/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "output/**"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # constraints-ci.txt overrides the local file:// e2m2e path with the git URL
          pip install -e ".[test]" -c constraints-ci.txt

      - name: Run tests
        run: pytest tests/ -v

      - name: Type check
        if: matrix.python-version == '3.13'
        run: |
          # e2m2e 已在 Install dependencies 步骤中通过 constraints-ci.txt 安装
          pip install pyright
          pyright
