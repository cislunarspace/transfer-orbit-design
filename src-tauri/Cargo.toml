[package]
name = "transfer-orbit-design"
version = "4.4.0"
edition = "2021"
description = "transfer-orbit-design Tauri 桌面应用（Rust 壳 + React 前端 + e2m2e sidecar）"

[lib]
name = "transfer_orbit_design_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "transfer-orbit-design"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "process", "io-util", "time"] }
anyhow = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
# AI 助手（ADR 0023）：LLM SSE 流式调用走 rustls（避开 Windows OpenSSL 现场编译）；
# API key 存 OS keychain（linux 用内核 keyutils 后端，不拉 D-Bus/secret-service 编译链）
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
keyring = { version = "3", default-features = false, features = ["windows-native", "apple-native", "linux-native"] }

# sidecar 子树生命周期兜底（Job Object kill-on-close），仅 Windows 需要
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects"] }
