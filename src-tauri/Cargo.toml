[package]
name = "tod-tauri"
version = "4.1.2"
edition = "2021"
description = "transfer-orbit-design Tauri 桌面应用（Rust 壳 + React 前端 + e2m2e sidecar）"

[lib]
name = "tod_tauri"
crate-type = ["staticlib", "cdylib", "lib"]

[[bin]]
name = "tod"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "sync", "rt-multi-thread", "process", "io-util", "time"] }
anyhow = "1"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
